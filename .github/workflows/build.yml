name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            preset: linux-release
            build_dir: build-release
            artifact_path: build-release/bin/mb
          - name: macos-arm64
            os: macos-latest
            preset: macos-release
            build_dir: build-release
            artifact_path: build-release/bin/mb.app

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Export GHA cache tokens for vcpkg
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config \
            libxcb1-dev libxcb-util-dev libxcb-sync-dev libxcb-xkb-dev libxcb-cursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev \
            libfontconfig-dev libdbus-1-dev

      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Run tests (excluding render suite)
        run: |
          rm -f /tmp/mb-tests.out
          ASAN_OPTIONS=detect_leaks=0 ./${{ matrix.build_dir }}/bin/mb-tests \
            --test-case-exclude='*render*' > /tmp/mb-tests.out 2>&1
          status=$?
          echo "exit=$status"
          grep -a -E 'Status:|FAIL|test cases:' /tmp/mb-tests.out || true
          grep -a -q 'Status: SUCCESS!' /tmp/mb-tests.out

      - name: Package macOS .app
        if: runner.os == 'macOS'
        run: |
          cd ${{ matrix.build_dir }}/bin
          zip -r mb-macos-arm64.zip mb.app

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          cd ${{ matrix.build_dir }}/bin
          tar -czf mb-linux-x64.tar.gz mb

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: mb-linux-x64
          path: ${{ matrix.build_dir }}/bin/mb-linux-x64.tar.gz

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: mb-macos-arm64
          path: ${{ matrix.build_dir }}/bin/mb-macos-arm64.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/mb-linux-x64.tar.gz
            artifacts/mb-macos-arm64.zip
          generate_release_notes: true
