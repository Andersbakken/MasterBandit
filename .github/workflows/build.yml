name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:


jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            preset: linux-release
            build_dir: build-release
            artifact_path: build-release/bin/mb
          - name: macos-arm64
            os: macos-latest
            preset: macos-release
            build_dir: build-release
            artifact_path: build-release/bin/mb.app

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ github.token }}

      - name: Set vcpkg binary cache path
        run: |
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-bincache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-bincache"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'overlay-ports/**', 'overlay-triplets/**') }}
          restore-keys: |
            vcpkg-${{ matrix.name }}-

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config \
            libxcb1-dev libxcb-util-dev libxcb-sync-dev libxcb-xkb-dev libxcb-cursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev \
            libfontconfig-dev libdbus-1-dev

      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ccache-${{ matrix.name }}
          max-size: 500M

      - name: Configure
        run: |
          cmake --preset ${{ matrix.preset }} \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Run tests (excluding render suite)
        run: |
          rm -f /tmp/mb-tests.out
          ASAN_OPTIONS=detect_leaks=0 ./${{ matrix.build_dir }}/bin/mb-tests \
            --test-case-exclude='*render*' > /tmp/mb-tests.out 2>&1
          status=$?
          echo "exit=$status"
          grep -a -E 'Status:|FAIL|test cases:' /tmp/mb-tests.out || true
          grep -a -q 'Status: SUCCESS!' /tmp/mb-tests.out

      - name: Package macOS .app
        if: runner.os == 'macOS'
        run: |
          cd ${{ matrix.build_dir }}/bin
          zip -r mb-macos-arm64.zip mb.app

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          tar -czf mb-linux-x64.tar.gz \
              --transform 's,^bin,mb,' \
              --exclude='bin/mb-tests' \
              --exclude='bin/grapheme_gen_*' \
              -C ${{ matrix.build_dir }} bin

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: mb-linux-x64
          path: mb-linux-x64.tar.gz

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: mb-macos-arm64
          path: ${{ matrix.build_dir }}/bin/mb-macos-arm64.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/mb-linux-x64.tar.gz
            artifacts/mb-macos-arm64.zip
          generate_release_notes: true

  nightly:
    name: Nightly Release
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Move nightly tag
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Nightly build"
          body: "Rolling build from master. Updated daily. Not a stable release."
          prerelease: true
          files: |
            artifacts/mb-linux-x64.tar.gz
            artifacts/mb-macos-arm64.zip
