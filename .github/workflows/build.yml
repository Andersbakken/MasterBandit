name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:


jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            preset: linux-release
            build_dir: build-release
            artifact_path: build-release/bin/mb
          - name: macos-arm64
            os: macos-latest
            preset: macos-release
            build_dir: build-release
            artifact_path: build-release/bin/mb.app

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ github.token }}

      - name: Set vcpkg binary cache path
        run: |
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-bincache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-bincache"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'overlay-ports/**', 'overlay-triplets/**') }}
          restore-keys: |
            vcpkg-${{ matrix.name }}-

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config \
            libxcb1-dev libxcb-util-dev libxcb-sync-dev libxcb-xkb-dev libxcb-cursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev \
            libfontconfig-dev libdbus-1-dev

      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Cache Dawn tarball
        uses: actions/cache@v5
        with:
          path: ${{ matrix.build_dir }}/3rdparty/dawn
          key: dawn-${{ matrix.name }}-${{ hashFiles('3rdparty/dawn/CMakeLists.txt') }}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ccache-${{ matrix.name }}
          max-size: 500M

      - name: Configure
        run: |
          cmake --preset ${{ matrix.preset }} \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DMB_ADHOC_SIGN=${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'OFF' || 'ON' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Run tests (excluding render suite)
        run: |
          rm -f /tmp/mb-tests.out
          ASAN_OPTIONS=detect_leaks=0 ./${{ matrix.build_dir }}/bin/mb-tests \
            --test-case-exclude='*render*' > /tmp/mb-tests.out 2>&1
          status=$?
          echo "exit=$status"
          grep -a -E 'Status:|FAIL|test cases:' /tmp/mb-tests.out || true
          grep -a -q 'Status: SUCCESS!' /tmp/mb-tests.out

      - name: Split Linux debug info
        if: runner.os == 'Linux'
        run: |
          set -e
          BIN=${{ matrix.build_dir }}/bin/mb
          objcopy --only-keep-debug "$BIN" "$RUNNER_TEMP/mb.debug"
          objcopy --strip-debug --strip-unneeded "$BIN"
          ( cd "$RUNNER_TEMP" && objcopy --add-gnu-debuglink=mb.debug "$GITHUB_WORKSPACE/$BIN" )
          gzip -9 "$RUNNER_TEMP/mb.debug"
          mv "$RUNNER_TEMP/mb.debug.gz" "$RUNNER_TEMP/mb-linux-x64.debug.gz"
          ls -lh "$BIN" "$RUNNER_TEMP/mb-linux-x64.debug.gz"

      - name: Extract macOS dSYM
        if: runner.os == 'macOS'
        run: |
          set -e
          APP=${{ matrix.build_dir }}/bin/mb.app
          BIN="$APP/Contents/MacOS/mb"
          dsymutil "$BIN" -o "$RUNNER_TEMP/mb.dSYM"
          strip -S "$BIN"
          # strip invalidates the cmake-time ad-hoc signature; re-apply so
          # unsigned-path artifacts (PR / master push) still have a valid
          # ad-hoc sig. Proper-sign step overwrites this when it runs.
          codesign --sign - --force --identifier "it.masterband.mb" "$APP"
          ( cd "$RUNNER_TEMP" && tar -czf mb-macos-arm64.dSYM.tar.gz mb.dSYM && rm -rf mb.dSYM )
          ls -lh "$BIN" "$RUNNER_TEMP/mb-macos-arm64.dSYM.tar.gz"

      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
              -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign mb.app
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          set -e
          APP="${{ matrix.build_dir }}/bin/mb.app"
          codesign --force --options runtime --timestamp \
              --sign "Developer ID Application: Jan E Hanssen (277JTPGVHJ)" \
              "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Notarize and staple
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
        run: |
          set -e
          APP="${{ matrix.build_dir }}/bin/mb.app"
          echo "$NOTARY_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          SUBMISSION_ZIP="$RUNNER_TEMP/mb-notarize.zip"
          ditto -c -k --keepParent "$APP" "$SUBMISSION_ZIP"
          xcrun notarytool submit "$SUBMISSION_ZIP" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --wait
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          rm "$RUNNER_TEMP/AuthKey.p8" "$SUBMISSION_ZIP"

      - name: Clean up keychain
        if: runner.os == 'macOS' && always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Package macOS .app
        if: runner.os == 'macOS'
        run: |
          cd ${{ matrix.build_dir }}/bin
          zip -r mb-macos-arm64.zip mb.app

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          tar -czf mb-linux-x64.tar.gz \
              --transform 's,^bin,mb,' \
              --exclude='bin/mb-tests' \
              --exclude='bin/grapheme_gen_*' \
              -C ${{ matrix.build_dir }} bin

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: mb-linux-x64
          path: mb-linux-x64.tar.gz

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: mb-macos-arm64
          path: ${{ matrix.build_dir }}/bin/mb-macos-arm64.zip

      - name: Upload Linux debug sidecar
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: mb-linux-x64-debug
          path: ${{ runner.temp }}/mb-linux-x64.debug.gz

      - name: Upload macOS dSYM sidecar
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: mb-macos-arm64-dsym
          path: ${{ runner.temp }}/mb-macos-arm64.dSYM.tar.gz

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/mb-linux-x64.tar.gz
            artifacts/mb-linux-x64.debug.gz
            artifacts/mb-macos-arm64.zip
            artifacts/mb-macos-arm64.dSYM.tar.gz
          generate_release_notes: true

  nightly:
    name: Nightly Release
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Move nightly tag
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Nightly build"
          body: "Rolling build from master. Updated daily. Not a stable release."
          prerelease: true
          files: |
            artifacts/mb-linux-x64.tar.gz
            artifacts/mb-linux-x64.debug.gz
            artifacts/mb-macos-arm64.zip
            artifacts/mb-macos-arm64.dSYM.tar.gz
